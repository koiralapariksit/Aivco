<body data-theme="argon" class="select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const API_BASE = window.location.origin;

    const THEMES = ['argon', 'ultron', 'amber'];
    const THEME_NAMES = { argon: 'ARGON', ultron: 'ULTRON', amber: 'AMBER' };
    const THEME_COLORS = { argon: '#56E2F5', ultron: '#FF4455', amber: '#F59E0B' };

    // ── Universal Reliable Clipboard Function ───────────────────────────────
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
        return Promise.resolve();
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Fallback copy failed', err);
      }
      document.body.removeChild(textArea);
    }

    // ── Utility: Tokenize markdown into text and code blocks ────────────────
    function parseMessageTokens(content) {
      if (!content) return [];
      const codeBlockRegex = /```([a-zA-Z0-9_\-+]*)\n([\s\S]*?)```/g;
      const parts = [];
      let lastIndex = 0;
      let match;

      while ((match = codeBlockRegex.exec(content)) !== null) {
        if (match.index > lastIndex) {
          parts.push({
            type: 'text',
            content: content.slice(lastIndex, match.index)
          });
        }
        parts.push({
          type: 'code',
          lang: match[1] || 'text',
          content: match[2]
        });
        lastIndex = match.index + match[0].length;
      }

      if (lastIndex < content.length) {
        parts.push({
          type: 'text',
          content: content.slice(lastIndex)
        });
      }

      return parts;
    }

    // ── CodeBlock Component with Syntax Highlighting & Action Bar ────────────
    function CodeBlock({ language, code, onOpenArtifact }) {
      const [copied, setCopied] = useState(false);
      const [wrapped, setWrapped] = useState(false);
      const codeRef = useRef(null);

      const lang = (language || 'code').toLowerCase();
      const lineCount = code ? code.trim().split('\n').length : 0;
      const isWebArtifact = ['html', 'xml', 'svg', 'javascript', 'js', 'css'].includes(lang) ||
                            code.includes('<!DOCTYPE') || code.includes('<html') || code.includes('<svg') || lineCount >= 10;

      useEffect(() => {
        if (codeRef.current) {
          codeRef.current.textContent = code;
          if (window.hljs) {
            try {
              codeRef.current.removeAttribute('data-highlighted');
              window.hljs.highlightElement(codeRef.current);
            } catch (e) {
              // fallback
            }
          }
        }
      }, [code, language]);

      const handleCopy = () => {
        copyToClipboard(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleDownload = () => {
        const extMap = {
          html: 'html', python: 'py', py: 'py', javascript: 'js', js: 'js',
          typescript: 'ts', ts: 'ts', css: 'css', json: 'json', markdown: 'md',
          md: 'md', bash: 'sh', sh: 'sh', sql: 'sql', rust: 'rs'
        };
        const ext = extMap[lang] || 'txt';
        const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `aivco_artifact_${Date.now()}.${ext}`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="my-2.5 rounded border border-border bg-[#070B12] overflow-hidden text-xs font-mono shadow-xl chat-selectable">
          {/* Top Bar */}
          <div className="flex items-center justify-between px-3 py-1.5 bg-[#0E1724] border-b border-border text-[11px] select-none">
            <div className="flex items-center gap-2">
              <span className="font-bold text-argon uppercase tracking-wider">{lang}</span>
              <span className="text-slate-600">•</span>
              <span className="text-slate-400">{lineCount} lines</span>
            </div>
            <div className="flex items-center gap-1.5">
              {isWebArtifact && (
                <button
                  type="button"
                  onClick={() => onOpenArtifact && onOpenArtifact({ lang, code, title: `${lang.toUpperCase()} Artifact` })}
                  className="px-2 py-0.5 rounded bg-argon/15 border border-argon/50 text-argon hover:bg-argon/30 transition-colors flex items-center gap-1 font-bold shadow-[0_0_8px_rgba(86,226,245,0.25)]"
                  title="Open Live HTML Preview Drawer"
                >
                  <span>⚡ LIVE PREVIEW ⤢</span>
                </button>
              )}
              <button
                type="button"
                onClick={() => setWrapped(!wrapped)}
                className={`px-1.5 py-0.5 rounded border transition-colors ${wrapped ? 'border-argon text-argon bg-argon/10' : 'border-border text-slate-400 hover:text-slate-200'}`}
                title="Toggle Wrap"
              >
                {wrapped ? 'WRAP' : 'NO-WRAP'}
              </button>
              <button
                type="button"
                onClick={handleDownload}
                className="px-1.5 py-0.5 rounded border border-border text-slate-400 hover:text-slate-200 hover:border-slate-500 transition-colors"
                title="Download Snippet"
              >
                ⬇
              </button>
              <button
                type="button"
                onClick={handleCopy}
                className={`px-2 py-0.5 rounded border transition-colors font-bold ${copied ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : 'border-border text-slate-300 hover:border-argon'}`}
              >
                {copied ? '✓ COPIED' : '📋 COPY'}
              </button>
            </div>
          </div>
          {/* Code Viewer */}
          <pre className={`p-3 overflow-x-auto text-[11.5px] leading-relaxed m-0 chat-selectable ${wrapped ? 'whitespace-pre-wrap' : 'whitespace-pre'}`}>
            <code ref={codeRef} className={`language-${lang} font-mono chat-selectable`}>
              {code}
            </code>
          </pre>
        </div>
      );
    }

    // ── Markdown Message Renderer ────────────────────────────────────────────
    function FormattedMessage({ text, onOpenArtifact }) {
      const tokens = useMemo(() => parseMessageTokens(text), [text]);

      return (
        <div className="w-full chat-selectable">
          {tokens.map((token, idx) => {
            if (token.type === 'code') {
              return (
                <CodeBlock 
                  key={idx} 
                  language={token.lang} 
                  code={token.content} 
                  onOpenArtifact={onOpenArtifact} 
                />
              );
            }
            const html = window.marked ? window.marked.parse(token.content) : token.content;
            return (
              <div 
                key={idx} 
                className="markdown-body chat-selectable" 
                dangerouslySetInnerHTML={{ __html: html }} 
              />
            );
          })}
        </div>
      );
    }

    // ── Dynamic Neural Memory Tree Graph (Ingests Real AIVCO Data) ──
    const COLS = [60, 200, 380, 580];     // x per column: root · engrams+trunks · projects · chat leaves
    const GAP = 38, ENGRAM_GAP = 58;      // min row gap for leaves (>=26px label buffer) · extra room for engram dots
    const isChat = n => n && (n.type === "chat" || n.type === "casual_chat");

    function MemoryGraph({
      activeChatId,
      activeProjectId,
      onSelectChat,
      onSelectProject,
      onNewChat,
      onOpenNewEngram,
      theme = 'argon',
      refreshKey = 0
    }) {
      const stageRef = useRef(null);
      const cvRef = useRef(null);
      const tipRef = useRef(null);
      const S = useRef({
        nodes: [],
        links: [],
        by: new Map(),
        parent: new Map(),
        asleep: false,
        view: { x: 0, y: 0, k: 1 },
        w: 0,
        h: 0,
        dpr: 1,
        hover: null,
        drag: null,
        pan: null,
        moved: false,
        match: () => true,
        term: "",
        active: null,
        path: new Set(),
        fit: () => {}
      });

      const [data, setData] = useState({ nodes: [], links: [] });
      const [filter, setFilter] = useState("all");
      const [q, setQ] = useState("");
      const [focus, setFocus] = useState(null);
      const [hoverId, setHoverId] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      const wake = () => { S.current.asleep = false; };

      // 0. Fetch real live data from /api/memory/graph
      const fetchGraph = useCallback(async () => {
        setIsLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/memory/graph`);
          if (res.ok) {
            const json = await res.json();
            setData(json);
          }
        } catch (err) {
          console.error("Failed to fetch memory graph:", err);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchGraph();
      }, [fetchGraph, refreshKey]);

      useEffect(() => {
        if (activeProjectId) {
          setFocus(`proj_${activeProjectId}`);
        }
      }, [activeProjectId]);

      /* 1. Build nodes/links, derive parent->child tree from links, lay out columns + rows */
      useEffect(() => {
        if (!data || !data.nodes || !data.nodes.length) return;
        const s = S.current, old = s.by, by = new Map();
        const nodes = data.nodes.map(d => {
          const o = old.get(d.id);
          const n = {
            ...d,
            x: o?.x ?? 0,
            y: o?.y ?? 0,
            vx: o?.vx ?? 0,
            vy: o?.vy ?? 0,
            ph: Math.random() * 6.28,
            seeded: !!o
          };
          by.set(n.id, n);
          return n;
        });
        const links = (data.links || []).map(l => ({
          a: by.get(l.source),
          b: by.get(l.target)
        })).filter(l => l.a && l.b);

        const root = nodes.find(n => n.type === "root") || nodes[0];
        if (!root) return;

        const kids = new Map(nodes.map(n => [n.id, []])), parent = new Map(), order = [root], seen = new Set([root.id]);
        for (let i = 0; i < order.length; i++) {
          links.forEach(l => {
            if (l.a === order[i] && !seen.has(l.b.id)) {
              seen.add(l.b.id);
              parent.set(l.b.id, l.a.id);
              kids.get(l.a.id).push(l.b);
              order.push(l.b);
            }
          });
        }
        nodes.forEach(n => {
          if (!seen.has(n.id)) {
            parent.set(n.id, root.id);
            kids.get(root.id).push(n);
            order.push(n);
          }
        });

        let cur = 0;
        const lay = (n, d) => {
          n.depth = d;
          const ks = kids.get(n.id);
          n.leaf = !ks.length;
          if (n.leaf) {
            const h = n.type === "engram" ? ENGRAM_GAP : GAP;
            n.ty = cur + h / 2;
            cur += h;
          } else {
            ks.forEach(k => lay(k, d + 1));
            n.ty = (ks[0].ty + ks[ks.length - 1].ty) / 2;
          }
        };
        lay(root, 0);

        nodes.forEach(n => {
          n.ty -= cur / 2;
          n.tx = COLS[isChat(n) ? 3 : Math.min(n.depth, 2)];
        });
        order.forEach(n => {
          if (!n.seeded) {
            const p = by.get(parent.get(n.id));
            n.x = (p ? p.x : 0) + (Math.random() - .5) * 12;
            n.y = (p ? p.y : 0) + (Math.random() - .5) * 12;
          }
        });

        Object.assign(s, { nodes, links, by, parent });
        wake();
        s.fit();
      }, [data]);

      /* 2. Active path: root -> active chat */
      useEffect(() => {
        const s = S.current;
        s.active = activeChatId;
        const set = new Set();
        for (let id = activeChatId; id && s.by.has(id); id = s.parent.get(id)) set.add(id);
        s.path = set;
      }, [activeChatId, data]);

      /* 3. Filter pills / project focus / search */
      useEffect(() => {
        const s = S.current, term = q.trim().toLowerCase();
        s.term = term;
        s.match = n => {
          let ok = true;
          if (focus) ok = n.id === focus || n.project_id === focus;
          else if (filter === "projects") ok = n.type === "project" || n.id === "trunk_projects" || (isChat(n) && !!n.project_id);
          else if (filter === "starred") ok = (isChat(n) && n.starred) || (n.type === "project" && (data.nodes || []).some(c => c.project_id === n.id && c.starred));
          return ok && (!term || (n.label || "").toLowerCase().includes(term) || (n.category || "").includes(term));
        };
      }, [filter, q, focus, data]);

      /* 4. Retina canvas + fit-to-view */
      useEffect(() => {
        const s = S.current, el = stageRef.current, cv = cvRef.current;
        if (!el || !cv) return;
        s.fit = () => {
          if (!s.w || !s.nodes.length) return;
          let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
          s.nodes.forEach(n => {
            a = Math.min(a, n.tx);
            b = Math.max(b, n.tx);
            c = Math.min(c, n.ty);
            d = Math.max(d, n.ty);
          });
          const v = s.view;
          v.k = Math.min((s.w - 260) / Math.max(b - a, 1), (s.h - 60) / Math.max(d - c, 1), 1.5);
          v.x = 44 - a * v.k;
          v.y = s.h / 2 - (c + d) / 2 * v.k;
        };
        const size = () => {
          if (!el || !cv) return;
          const r = el.getBoundingClientRect(), d = window.devicePixelRatio || 1;
          s.w = r.width;
          s.h = r.height;
          s.dpr = d;
          cv.width = Math.round(r.width * d);
          cv.height = Math.round(r.height * d);
          if (!s.sized && r.width) {
            s.sized = true;
            s.fit();
          }
        };
        size();
        const ro = new ResizeObserver(size);
        ro.observe(el);
        window.addEventListener("resize", size);
        return () => {
          ro.disconnect();
          window.removeEventListener("resize", size);
        };
      }, []);

      /* 5. Spring physics (nodes ease to their tree slots) + render loop */
      useEffect(() => {
        const s = S.current, cv = cvRef.current;
        if (!cv) return;
        const ctx = cv.getContext("2d");
        let raf, last = performance.now();

        const step = dt => {
          if (s.asleep) return;
          const { nodes } = s;
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i], b = nodes[j];
              let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
              if (d2 > 78400) continue;
              d2 = Math.max(d2, 100);
              const d = Math.sqrt(d2), f = 600 / d2;
              dx /= d;
              dy /= d;
              a.vx -= dx * f;
              a.vy -= dy * f;
              b.vx += dx * f;
              b.vy += dy * f;
            }
          }
          const damp = Math.pow(.8, dt);
          let mv = 0;
          for (const n of nodes) {
            n.vx += (n.tx - n.x) * .07;
            n.vy += (n.ty - n.y) * .07;
            if (s.drag === n) {
              n.vx = n.vy = 0;
              continue;
            }
            n.vx *= damp;
            n.vy *= damp;
            n.x += n.vx * dt;
            n.y += n.vy * dt;
            mv = Math.max(mv, Math.abs(n.vx) + Math.abs(n.vy));
          }
          if (!s.drag && mv < .02) s.asleep = true;
        };

        const draw = t => {
          const { w, h, dpr, view: v, nodes, links } = s;
          const pulse = .5 + .5 * Math.sin(t / 600);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          ctx.save();
          ctx.translate(v.x, v.y);
          ctx.scale(v.k, v.k);

          for (const l of links) {
            const { a, b } = l;
            const m = s.match(a) && s.match(b);
            const hi = s.path.has(a.id) && s.path.has(b.id) && s.parent.get(b.id) === a.id;
            const cas = b.type === "casual_chat" || b.id === "trunk_casual";
            const amb = b.type === "project" || b.type === "chat" || b.id === "trunk_projects";
            const dx = b.x - a.x;

            ctx.globalAlpha = m ? 1 : .12;
            ctx.lineWidth = (hi ? 1.8 : 1) / v.k;
            ctx.strokeStyle = hi ? "rgba(245,158,11,.8)" : cas ? "rgba(148,163,184,.25)" : amb ? "rgba(245,158,11,.35)" : "rgba(56,189,248,.22)";
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.bezierCurveTo(a.x + dx * .5, a.y, b.x - dx * .5, b.y, b.x, b.y);
            ctx.stroke();

            if (hi) {
              const u = (t / 1600 + a.ph) % 1, mx = (a.x + b.x) / 2, i = 1 - u;
              const x = i * i * i * a.x + 3 * i * i * u * mx + 3 * i * u * u * mx + u * u * u * b.x;
              const y = i * i * i * a.y + 3 * i * i * u * a.y + 3 * i * u * u * b.y + u * u * u * b.y;
              ctx.globalAlpha = 1;
              ctx.fillStyle = "#fff";
              ctx.shadowColor = "#f59e0b";
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.arc(x, y, 2.2 / v.k, 0, 6.283);
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          }

          for (const n of nodes) {
            const m = s.match(n), hov = s.hover === n, act = n.id === s.active, hit = s.term && m;
            const r = n.radius * (hov ? 1.3 : 1) * (hit ? 1 + .25 * pulse : 1);
            const dim = m ? 1 : .13;

            if (n.type === "project" || n.type === "trunk" || (isChat(n) && n.starred)) {
              ctx.strokeStyle = n.color;
              ctx.globalAlpha = dim * (.15 + .25 * (1 - pulse));
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 4 + pulse * 5, 0, 6.283);
              ctx.stroke();
            }

            if (n.type === "engram") {
              const N = Math.min(n.count || 0, 24);
              ctx.fillStyle = n.color;
              ctx.globalAlpha = dim * .85;
              for (let i = 0; i < N; i++) {
                const a = i * 6.283 / N - 1.5708, rr = r + 11 + (i % 3) * 3;
                ctx.beginPath();
                ctx.arc(n.x + Math.cos(a) * rr, n.y + Math.sin(a) * rr, 1.7, 0, 6.283);
                ctx.fill();
              }
            }

            if (n.type === "project" && n.instructions_len != null) {
              ctx.globalAlpha = dim;
              ctx.lineWidth = 2;
              ctx.strokeStyle = n.color;
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 6, -1.5708, -1.5708 + 6.283 * Math.min(1, n.instructions_len / 2000));
              ctx.stroke();
            }

            ctx.globalAlpha = dim;
            ctx.fillStyle = n.color;
            ctx.shadowColor = n.glow || n.color;
            ctx.shadowBlur = m ? (hov || act || hit ? 22 : isChat(n) ? 8 : 15) : 0;
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, 6.283);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (n.has_recap) {
              ctx.strokeStyle = n.color;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 2.5, 0, 6.283);
              ctx.stroke();
            }

            if (n.type === "root" || n.type === "trunk") {
              ctx.strokeStyle = n.glow;
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 4 + pulse * 2, 0, 6.283);
              ctx.stroke();
            }

            if (act) {
              for (let k = 0; k < 2; k++) {
                const ph = ((t / 1700) + k * .5) % 1;
                ctx.globalAlpha = (1 - ph) * .9;
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(n.x, n.y, r + 4 + ph * 24, 0, 6.283);
                ctx.stroke();
              }
            }

            if (m) {
              ctx.globalAlpha = .92;
              ctx.fillStyle = "#cfe8ef";
              ctx.font = `${(isChat(n) ? 9.5 : 10.5) / v.k}px "IBM Plex Mono", monospace`;
              const lim = n.leaf ? 38 : 24;
              const txt = (n.label || "").length > lim ? (n.label || "").slice(0, lim - 1) + "..." : (n.label || "");
              if (n.leaf) {
                ctx.textAlign = "left";
                ctx.fillText(txt, n.x + r + 9 / v.k, n.y + 3.5 / v.k);
              } else {
                ctx.textAlign = "center";
                ctx.fillText(txt, n.x, n.y - r - (n.type === "engram" || n.type === "project" ? 20 : 10) / v.k);
              }
            }
          }
          ctx.restore();
          ctx.globalAlpha = 1;
        };

        const loop = t => {
          const dt = Math.min((t - last) / 16.667, 3);
          last = t;
          step(dt);
          draw(t);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, []);

      /* 6. Pointer: drag node · pan · wheel zoom · hover · click */
      useEffect(() => {
        const s = S.current, cv = cvRef.current;
        if (!cv) return;

        const pos = e => {
          const r = cv.getBoundingClientRect();
          return [e.clientX - r.left, e.clientY - r.top];
        };
        const world = (x, y) => [(x - s.view.x) / s.view.k, (y - s.view.y) / s.view.k];
        const hit = (x, y) => {
          const [wx, wy] = world(x, y);
          let best = null, bd = 1e9;
          for (const n of s.nodes) {
            const d = Math.hypot(n.x - wx, n.y - wy);
            if (d <= n.radius + 6 / s.view.k && d < bd) {
              best = n;
              bd = d;
            }
          }
          return best;
        };

        const down = e => {
          const [x, y] = pos(e), n = e.button === 2 ? null : hit(x, y);
          s.moved = false;
          cv.setPointerCapture(e.pointerId);
          if (n) {
            s.drag = n;
            wake();
          } else {
            s.pan = { x, y, vx: s.view.x, vy: s.view.y };
          }
          cv.style.cursor = "grabbing";
        };

        const move = e => {
          const [x, y] = pos(e);
          if (s.drag) {
            const [wx, wy] = world(x, y);
            s.drag.x = wx;
            s.drag.y = wy;
            s.moved = true;
            wake();
            return;
          }
          if (s.pan) {
            if (Math.abs(x - s.pan.x) + Math.abs(y - s.pan.y) > 3) s.moved = true;
            s.view.x = s.pan.vx + x - s.pan.x;
            s.view.y = s.pan.vy + y - s.pan.y;
            return;
          }
          const n = hit(x, y);
          if (n !== s.hover) {
            s.hover = n;
            setHoverId(n ? n.id : null);
          }
          cv.style.cursor = n ? "pointer" : "grab";
          if (tipRef.current) {
            tipRef.current.style.transform = `translate(${Math.min(x + 16, s.w - 260)}px,${Math.min(y + 16, s.h - 130)}px)`;
          }
        };

        const up = () => {
          const n = s.drag, mv = s.moved;
          s.drag = null;
          s.pan = null;
          wake();
          cv.style.cursor = s.hover ? "pointer" : "grab";
          if (n && !mv) {
            if (isChat(n)) {
              onSelectChat?.(n.id);
            } else if (n.type === "project") {
              setFocus(f => f === n.id ? null : n.id);
              const rawPid = n.id.replace(/^proj_/, "");
              onSelectProject?.(rawPid);
            }
          }
        };

        const wheel = e => {
          e.preventDefault();
          const [x, y] = pos(e), [wx, wy] = world(x, y);
          const k = Math.min(4, Math.max(.3, s.view.k * Math.exp(-e.deltaY * .0015)));
          s.view.k = k;
          s.view.x = x - wx * k;
          s.view.y = y - wy * k;
        };

        const leave = () => {
          s.hover = null;
          setHoverId(null);
        };
        const noCtx = e => e.preventDefault();

        cv.addEventListener("pointerdown", down);
        cv.addEventListener("pointermove", move);
        cv.addEventListener("pointerup", up);
        cv.addEventListener("pointerleave", leave);
        cv.addEventListener("wheel", wheel, { passive: false });
        cv.addEventListener("contextmenu", noCtx);
        return () => {
          cv.removeEventListener("pointerdown", down);
          cv.removeEventListener("pointermove", move);
          cv.removeEventListener("pointerup", up);
          cv.removeEventListener("pointerleave", leave);
          cv.removeEventListener("wheel", wheel);
          cv.removeEventListener("contextmenu", noCtx);
        };
      }, [onSelectChat, onSelectProject]);

      const hn = hoverId && S.current.by.get(hoverId);
      const proj = hn?.project_id && S.current.by.get(hn.project_id);
      const fp = focus && S.current.by.get(focus);

        <div className="glass-bracket p-2.5 rounded flex-1 flex flex-col gap-1.5 min-h-[300px] relative overflow-hidden bg-slate-950/70 border border-border/80">

          <div className="mg">

    // ── 3D HTML5 Canvas Memory Constellation Sphere ─────────────────────────
    function ConstellationSphere({ themeColor = '#56E2F5' }) {
      const canvasRef = useRef(null);
      const isDraggingRef = useRef(false);
      const lastMouseRef = useRef({ x: 0, y: 0 });
      const rotRef = useRef({ x: 0.35, y: 0.5 });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const numPoints = 36;
        const points = [];
        const phi = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < numPoints; i++) {
          const y = 1 - (i / (numPoints - 1)) * 2;
          const radius = Math.sqrt(1 - y * y);
          const theta = phi * i;
          const x = Math.cos(theta) * radius;
          const z = Math.sin(theta) * radius;
          points.push({ x, y, z });
        }

        const render = () => {
          if (!isDraggingRef.current) {
            rotRef.current.y += 0.006;
            rotRef.current.x += 0.002;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          const sphereRadius = 46;

          const cosX = Math.cos(rotRef.current.x);
          const sinX = Math.sin(rotRef.current.x);
          const cosY = Math.cos(rotRef.current.y);
          const sinY = Math.sin(rotRef.current.y);

          const rotated = points.map(p => {
            let x1 = p.x * cosY - p.z * sinY;
            let z1 = p.z * cosY + p.x * sinY;
            let y1 = p.y * cosX - z1 * sinX;
            let z2 = z1 * cosX + p.y * sinX;

            const fov = 160;
            const scale = fov / (fov + z2 * sphereRadius);
            const px = cx + x1 * sphereRadius * scale;
            const py = cy + y1 * sphereRadius * scale;

            return { x: px, y: py, z: z2, scale };
          });

          for (let i = 0; i < rotated.length; i++) {
            for (let j = i + 1; j < rotated.length; j++) {
              const dx = rotated[i].x - rotated[j].x;
              const dy = rotated[i].y - rotated[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 32) {
                const alpha = Math.max(0.04, (1 - dist / 32) * 0.35);
                ctx.beginPath();
                ctx.moveTo(rotated[i].x, rotated[i].y);
                ctx.lineTo(rotated[j].x, rotated[j].y);
                ctx.strokeStyle = themeColor;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }
          }

          for (let i = 0; i < rotated.length; i++) {
            const pt = rotated[i];
            const alpha = Math.max(0.2, (pt.z + 1) / 2);
            const r = Math.max(1.2, 2.2 * pt.scale);

            ctx.beginPath();
            ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
            ctx.fillStyle = themeColor;
            ctx.globalAlpha = alpha;
            ctx.shadowColor = themeColor;
            ctx.shadowBlur = 5;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
          ctx.globalAlpha = 1.0;

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [themeColor]);

      const handleMouseDown = (e) => {
        isDraggingRef.current = true;
        lastMouseRef.current = { x: e.clientX, y: e.clientY };
      };

      const handleMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - lastMouseRef.current.x;
        const dy = e.clientY - lastMouseRef.current.y;
        rotRef.current.y += dx * 0.01;
        rotRef.current.x -= dy * 0.01;
        lastMouseRef.current = { x: e.clientX, y: e.clientY };
      };

      const handleMouseUp = () => {
        isDraggingRef.current = false;
      };

      return (
        <div 
          className="relative flex flex-col items-center justify-center p-2 rounded bg-card/60 border border-border overflow-hidden cursor-grab active:cursor-grabbing select-none"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
        >
          <div className="w-full flex items-center justify-between text-[10px] font-mono text-slate-400 mb-0.5">
            <span>3D MEMORY CONSTELLATION</span>
            <span className="text-argon animate-pulse">V2 GRAPH</span>
          </div>
          <canvas ref={canvasRef} width="220" height="120" className="w-full h-[120px]" />
          <div className="text-[9px] font-mono text-slate-500 mt-0.5">Drag to rotate • 36 Nodes Synced</div>
        </div>
      );
    }

            let m;
            let bestCode = null;
            let maxLen = 0;
            while ((m = htmlBlockRegex.exec(data.response)) !== null) {
              const candidate = m[1].trim();
              if (candidate.includes('<html') || candidate.includes('<!DOCTYPE') || candidate.includes('<body') || candidate.includes('<style')) {
                if (candidate.length > maxLen) {
                  maxLen = candidate.length;

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ project_id: activeProjectId, text: cleanSnippet })

                  className="bg-obsidian border border-border rounded p-2 text-slate-200 outline-none focus:border-argon"
                />

                <div className="flex justify-end gap-2 mt-2">
                  <button 
                    type="button"
                    onClick={() => setShowNewEngramModal(false)}
                    className="px-3 py-1.5 rounded border border-border text-slate-400 hover:text-white"
                  >
                    Cancel
                  </button>
                  <button 
                    type="button"
                    onClick={handleAddEngram}
                    className="px-4 py-1.5 rounded bg-argon text-obsidian font-bold"
                  >
                    Save Engram
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* Pinned Decisions Drawer (Project Mode) */}
          {chatMode === 'project' && showPinnedDrawer && (
            <div className="fixed top-14 right-4 z-40 w-84 max-w-full glass-bracket bg-[#0A1017]/95 border border-amber-400/50 rounded-xl shadow-[0_0_30px_rgba(251,191,36,0.15)] flex flex-col font-mono text-xs backdrop-blur-md animate-slide-in">
              {/* Drawer Header */}
              <div className="flex items-center justify-between p-3 border-b border-border/80 bg-slate-900/60 rounded-t-xl">
                <div className="flex items-center gap-2 text-amber-300 font-bold">
                  <span>📌</span>
                  <span>PINNED DECISIONS ({pinnedList.length}/10)</span>
                </div>
                <button
                  type="button"
                  onClick={() => setShowPinnedDrawer(false)}
                  className="text-slate-400 hover:text-white px-1.5 py-0.5 rounded cursor-pointer text-sm"
                  title="Close Drawer"
                >
                  ✕
                </button>
              </div>

              {/* Project context indicator */}
              <div className="px-3 py-1.5 bg-amber-400/5 border-b border-amber-400/20 text-[10px] text-amber-200/80 flex items-center justify-between">
                <span>Project: <strong className="text-amber-300">{activeProjectId}</strong></span>
                <span>Max 120 chars/pin</span>
              </div>

              {/* Pins List */}
              <div className="p-3 max-h-80 overflow-y-auto space-y-2">
                {pinnedList.length === 0 ? (
                  <div className="text-center py-6 text-slate-500 text-[11px] font-sans">
                    No pinned decisions yet.<br />
                    Click <strong className="text-amber-300 font-mono">📌 PIN</strong> on any message or type <code className="text-argon">pin: &lt;decision&gt;</code> in chat.
                  </div>
                ) : (
                  pinnedList.map((pinText, idx) => (
                    <div
                      key={idx}
                      className="flex items-start justify-between gap-2 p-2 rounded bg-slate-900/80 border border-slate-800 hover:border-amber-400/40 transition-colors group"
                    >
                      <div className="flex items-start gap-1.5 flex-1 min-w-0">
                        <span className="text-amber-400 text-[10px] mt-0.5">•</span>
                        <span className="text-slate-200 text-[11px] leading-snug break-words font-sans">{pinText}</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => handleUnpin(idx)}
                        className="text-slate-500 hover:text-rose-400 text-xs px-1.5 py-0.5 rounded transition-colors opacity-70 group-hover:opacity-100 cursor-pointer font-bold"
                        title="Unpin Decision"
                      >
                        ✕
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* Project Creation Modal */}
          {showNewProjectModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-bracket p-6 rounded-xl max-w-md w-full bg-[#0A1017] border border-amber-400/50 flex flex-col gap-4 font-mono text-xs shadow-[0_0_30px_rgba(251,191,36,0.2)]">
                {/* Modal Header */}
                <div className="flex justify-between items-center border-b border-border pb-3">
                  <div className="flex items-center gap-2 text-amber-300 font-bold text-sm">
                    <span>📁</span>
                    <span>CREATE NEW PROJECT</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowNewProjectModal(false)}
                    className="text-slate-400 hover:text-white px-2 py-1 text-sm font-bold cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleCreateProjectSubmit} className="flex flex-col gap-3">
                  <div>
                    <label className="block text-[11px] text-slate-300 font-bold mb-1">
                      PROJECT NAME
                    </label>
                    <input
                      type="text"
                      value={newProjectName}
                      onChange={(e) => handleProjectNameChange(e.target.value)}
                      placeholder="e.g., E-Commerce Platform"
                      className="w-full bg-slate-950 border border-border rounded p-2 text-slate-100 outline-none focus:border-amber-400 font-sans text-xs"
                      autoFocus
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-300 font-bold mb-1">
                      PROJECT ID (AUTO-SLUGIFIED)
                    </label>
                    <input
                      type="text"
                      value={newProjectSlug}
                      onChange={(e) => setNewProjectSlug(e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, ''))}
                      placeholder="e-commerce-platform"
                      className="w-full bg-slate-950 border border-border rounded p-2 text-amber-300 outline-none focus:border-amber-400 font-mono text-xs"
                      required
                    />
                    <div className="text-[10px] text-slate-500 mt-0.5">Alphanumeric, dashes, and underscores only.</div>
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-300 font-bold mb-1">
                      PROJECT INSTRUCTIONS & DIRECTIVES (OPTIONAL)
                    </label>
                    <textarea
                      value={newProjectInstructions}
                      onChange={(e) => setNewProjectInstructions(e.target.value.slice(0, 2000))}
                      placeholder="e.g., Always use Tailwind CSS and strict TypeScript. Backend runs on FastAPI..."
                      rows={4}
                      className="w-full bg-slate-950 border border-border rounded p-2 text-slate-200 outline-none focus:border-amber-400 font-sans text-xs resize-none"
                    />
                    <div className="flex justify-between text-[10px] text-slate-500 mt-0.5">
                      <span>Injected into LLM project context</span>
                      <span>{newProjectInstructions.length}/2000</span>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-border">
                    <button
                      type="button"
                      onClick={() => setShowNewProjectModal(false)}
                      className="px-3 py-1.5 rounded border border-border text-slate-400 hover:text-white cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded bg-amber-400 text-obsidian font-bold hover:bg-amber-300 cursor-pointer shadow-[0_0_12px_rgba(251,191,36,0.3)]"
                    >
                      Create Project
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* AIVCO Native Chrome Extension Bridge Modal */}
          {showVaultModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-bracket p-6 rounded-xl max-w-2xl w-full bg-[#0A101A] border border-argon/50 flex flex-col gap-5 font-mono text-xs shadow-[0_0_40px_rgba(86,226,245,0.2)]">
                {/* Header */}
                <div className="flex justify-between items-center border-b border-border/80 pb-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">⚡</span>
                    <div>
                      <div className="font-bold text-sm tracking-wider text-argon">AIVCO NATIVE CHROME EXTENSION BRIDGE</div>
                      <div className="text-[11px] text-slate-400 font-sans">
                        Manifest V3 • Authentic Chrome Session • Zero Bot Detection
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={checkExtensionStatus}
                      className="px-2.5 py-1 rounded border border-argon/40 text-argon bg-argon/10 hover:bg-argon/25 flex items-center gap-1 text-[11px] cursor-pointer"
                    >
                      <span>🔄</span>
                      <span>Refresh Status</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowVaultModal(false)}
                      className="text-slate-400 hover:text-white px-2 py-1 text-sm font-bold cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Status Hero */}
                <div className={`p-4 rounded-xl border flex flex-col sm:flex-row justify-between items-center gap-4 ${
                  extensionStatus?.connected
                    ? 'border-emerald-500/40 bg-emerald-950/20 shadow-[0_0_20px_rgba(16,185,129,0.15)]'
                    : 'border-red-500/40 bg-red-950/20 shadow-[0_0_20px_rgba(239,68,68,0.15)]'
                }`}>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm text-slate-100">Extension Bridge Connection:</span>
                      <span className={`px-2 py-0.5 rounded text-[11px] font-bold border ${
                        extensionStatus?.connected
                          ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50'
                          : 'bg-red-500/20 text-red-400 border-red-500/50'
                      }`}>
                        {extensionStatus?.connected ? '🟢 CONNECTED' : '🔌 DISCONNECTED'}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-400 mt-1 font-sans">
                      WebSocket Endpoint: <code className="text-argon">ws://127.0.0.1:8000/ws/bridge</code>
                    </div>
                  </div>
                </div>

                {/* 3 Step Installation Guide */}
                <div className="p-4 rounded-lg bg-surface/80 border border-border flex flex-col gap-3 font-sans">
                  <div className="text-[12px] font-bold text-argon uppercase tracking-wider font-mono flex items-center gap-2">
                    <span>📋 Quick Setup Instructions</span>
                  </div>
                  <div className="flex flex-col gap-2.5 text-xs text-slate-300">
                    <div className="flex items-start gap-2.5">
                      <span className="flex-shrink-0 w-5 h-5 rounded-full bg-argon/20 text-argon border border-argon/40 flex items-center justify-center font-bold font-mono text-[11px]">1</span>
                      <div>
                        Open <code className="bg-obsidian px-1.5 py-0.5 rounded text-argon font-mono text-[11px]">chrome://extensions</code> in Google Chrome and enable <b className="text-slate-100">Developer mode</b> (toggle top-right).
                      </div>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="flex-shrink-0 w-5 h-5 rounded-full bg-argon/20 text-argon border border-argon/40 flex items-center justify-center font-bold font-mono text-[11px]">2</span>
                      <div>
                        Click <b className="text-slate-100">Load unpacked</b> and select the <code className="bg-obsidian px-1.5 py-0.5 rounded text-ambercore font-mono text-[11px]">extension/</code> folder located in your AIVCO project directory.
                      </div>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="flex-shrink-0 w-5 h-5 rounded-full bg-argon/20 text-argon border border-argon/40 flex items-center justify-center font-bold font-mono text-[11px]">3</span>
                      <div>
                        Keep <b className="text-slate-100">claude.ai</b>, <b className="text-slate-100">chatgpt.com</b>, <b className="text-slate-100">gemini.google.com</b>, or <b className="text-slate-100">grok.com</b> open in any tab.
                      </div>
                    </div>
                  </div>
                </div>

                {/* Detected Tabs */}
                <div>
                  <div className="text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2.5 flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-argon"></span>
                    <span>Detected AI Tabs</span>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {[
                      { key: 'claude', name: 'Claude', url: 'https://claude.ai' },
                      { key: 'chatgpt', name: 'ChatGPT', url: 'https://chatgpt.com' },
                      { key: 'gemini', name: 'Gemini', url: 'https://gemini.google.com/app' },
                      { key: 'grok', name: 'Grok', url: 'https://grok.com' }
                    ].map(prov => {
                      const isTabOpen = Boolean(extensionStatus?.tabs?.[prov.key]);
                      return (
                        <div key={prov.key} className="p-2.5 rounded-lg bg-surface/80 border border-border flex flex-col gap-1.5">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-100 text-[11px]">{prov.name}</span>
                            <span className={`w-2 h-2 rounded-full ${isTabOpen ? 'bg-emerald-400 shadow-[0_0_6px_#10b981]' : 'bg-slate-600'}`}></span>
                          </div>
                          <span className={`text-[10px] ${isTabOpen ? 'text-emerald-400 font-bold' : 'text-slate-500'}`}>
                            {isTabOpen ? '🟢 Active Tab' : '⚪ Not Detected'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Footer */}
                <div className="border-t border-border/80 pt-3 flex justify-between items-center text-[11px] text-slate-400 font-sans">
                  <span>AIVCO dispatches prompts directly through the authentic user tab without bot restrictions.</span>
                  <button
                    type="button"
                    onClick={() => setShowVaultModal(false)}
                    className="px-4 py-1.5 rounded bg-argon text-obsidian font-bold hover:bg-argon/90 font-mono text-xs cursor-pointer"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Global Search Modal (Ctrl+K) */}
          {showSearchModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-bracket p-4 rounded max-w-lg w-full bg-card border border-border flex flex-col gap-3 font-mono text-xs">
                <div className="flex justify-between items-center text-argon font-bold">
                  <span>GLOBAL ENGRAM SEARCH</span>
                  <button type="button" onClick={() => setShowSearchModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Type to search engrams, tasks, or commands..."
                  className="bg-obsidian border border-border rounded p-2 text-slate-200 outline-none focus:border-argon"
                  autoFocus
                />
                <div className="max-h-60 overflow-y-auto space-y-1.5">
                  {searchQuery.trim() && Object.values(state.layers || {}).flat()
                    .filter(item => 
                      (item.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                      (item.body || '').toLowerCase().includes(searchQuery.toLowerCase())
                    )
                    .map((item, idx) => (
                      <div 
                        key={idx} 
                        className="p-2 rounded bg-slate-900 border border-border/60 hover:border-argon cursor-pointer"
                        onClick={() => {
                          handleSendChat(`recall ${item.title}`);
                          setShowSearchModal(false);
                        }}
                      >
                        <div className="font-bold text-slate-200">{item.title}</div>
                        <div className="text-slate-400 text-[10px] truncate">{item.body}</div>
                      </div>
                    ))}
                  {searchQuery.trim() && (
                    <div 
                      className="p-2 rounded bg-argon/10 border border-argon/30 hover:bg-argon/20 cursor-pointer text-argon"
                      onClick={() => {
                        handleSendChat(searchQuery);
                        setShowSearchModal(false);
                      }}
                    >
                      Ask AIVCO: &quot;{searchQuery}&quot;
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
